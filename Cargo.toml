[package]
name = "sublime"
version = "0.18.0"
edition = "2024"
rust-version = "1.85"
description = "Universal efficient file conversion"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Chimi6/Sublime"
publish = false

[dependencies]
# Intentionally empty. See DOCS/DEPENDENCIES.md before adding anything.

[features]
# `sublime inspect`: dumps an iWork package's object graph. Development only.
dev-tools = []

[dev-dependencies]

[workspace]
exclude = ["bench", "wasm"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
